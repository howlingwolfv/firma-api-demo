quarkus.http.port=8080

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:*}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Accept,Authorization,Content-Type,X-Requested-With

azure.storage.account-name=${AZURE_STORAGE_ACCOUNT_NAME:stfirmademo}
azure.storage.container=${AZURE_STORAGE_CONTAINER:documents}

firma.fido2.challenge-ttl-seconds=${FIDO2_CHALLENGE_TTL_SECONDS:300}
